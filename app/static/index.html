<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Photo Library</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <div id="left-panel" class="panel">
            <div class="panel-header">Folders</div>
            <div id="folder-list"></div>
        </div>
        <div id="center-panel" class="panel">
            <div class="panel-header">
                <span id="grid-title">Select a folder</span>
                <div id="grid-actions">
                    <div id="unit-toggle" class="hidden">
                        <label><input type="radio" name="weight-unit" value="kg" checked> kg</label>
                        <label><input type="radio" name="weight-unit" value="lbs"> lbs</label>
                    </div>
                    <button id="btn-export" class="btn btn-sm" style="display:none">Export .xlsx</button>
                    <button id="btn-cull" class="btn btn-sm" disabled title="Select 2+ images to cull">Cull Selected</button>
                    <button id="btn-execute" class="btn btn-sm btn-danger" style="display:none">Execute Deletions</button>
                </div>
            </div>
            <div id="ocr-progress" class="hidden">
                <div id="ocr-progress-label">Processing...</div>
                <div id="ocr-progress-track"><div id="ocr-progress-fill"></div></div>
            </div>
            <div id="thumbnail-grid"></div>
        </div>
        <div id="right-panel" class="panel">
            <div id="ocr-detail" class="hidden">
                <div class="ocr-detail-header">
                    <span>OCR Result</span>
                    <span id="ocr-detail-close" title="Close">&times;</span>
                </div>
                <div id="ocr-detail-body"></div>
            </div>
            <div class="panel-header">Activity</div>
            <div id="status-feed"></div>
        </div>
    </div>

    <!-- Full-size viewer overlay -->
    <div id="viewer-overlay" class="hidden">
        <div id="viewer-main">
            <div id="viewer-close">&times;</div>
            <div id="viewer-counter"></div>
            <div id="viewer-filename"></div>
            <div id="viewer-status-badge" class="hidden"></div>
            <div id="viewer-container"></div>
            <div id="viewer-magnifier" class="hidden"></div>
        </div>
        <div id="viewer-side">
            <div class="viewer-side-header">OCR Result</div>
            <div id="viewer-ocr-detail"></div>
            <div class="viewer-side-header">Tag ROI</div>
            <div id="viewer-tagroi-wrap" class="viewer-crop-wrap">
                <img id="viewer-tagroi-img" class="hidden">
                <div id="viewer-tagroi-empty" class="viewer-side-empty">No tag ROI</div>
            </div>
            <div class="viewer-side-header">LED Crop</div>
            <div id="viewer-led-wrap" class="viewer-crop-wrap">
                <img id="viewer-led-img" class="hidden">
                <div id="viewer-led-empty" class="viewer-side-empty">No LED crop</div>
            </div>
        </div>
    </div>

    <!-- Culling overlay -->
    <div id="culler-overlay" class="hidden">
        <div id="culler-header">
            <span id="culler-title">Culling Mode</span>
            <div id="culler-actions">
                <button id="btn-finalize" class="btn btn-sm">Finalize (Enter)</button>
                <button id="btn-exit-cull" class="btn btn-sm">Exit (Esc)</button>
            </div>
        </div>
        <div id="culler-container">
            <div id="culler-pick" class="culler-pane">
                <div class="culler-label">PICK</div>
                <img id="culler-pick-img" src="">
            </div>
            <div id="culler-candidate" class="culler-pane">
                <div class="culler-label">CANDIDATE <span id="culler-candidate-counter"></span></div>
                <img id="culler-candidate-img" src="">
            </div>
        </div>
    </div>

    <!-- ROI overlay -->
    <div id="roi-overlay" class="hidden">
        <div id="roi-header">
            <span id="roi-title">Select OCR Region</span>
            <div id="roi-actions">
                <button id="btn-roi-clear" class="btn btn-sm">Clear</button>
                <span id="roi-hint">Click cells, then Enter to start OCR</span>
            </div>
        </div>
        <div id="roi-body">
            <div id="roi-image-wrap">
                <img id="roi-image">
                <div id="roi-grid"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/statusfeed.js"></script>
    <script src="/static/js/grid.js"></script>
    <script src="/static/js/viewer.js"></script>
    <script src="/static/js/culler.js"></script>
    <script src="/static/js/ocrdetail.js"></script>
    <script src="/static/js/roi.js"></script>
    <script src="/static/js/shortcuts.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
